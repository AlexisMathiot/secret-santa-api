nelmio_api_doc:
  documentation:
    info:
      title: Super Secret Santa API
      description:
      version: 1.0.0
    components:
      securitySchemes:
        Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
    security:
      - Bearer: []
  areas:
    path_patterns:
      - ^/api(?!/doc$) # Routes API (exclut /api/doc)
      - ^/invitations # Routes d'invitations publiques
      - ^/process/invitations
